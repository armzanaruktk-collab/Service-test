name: Android Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          import os
          import base64
          raw_data = os.environ.get('SIGNING_KEY', '')
          if raw_data:
              clean_data = "".join(raw_data.split())
              with open("app/release-key.jks", "wb") as f:
                  f.write(base64.b64decode(clean_data))
              print("Decoded release-key.jks successfully")
          else:
              print("SIGNING_KEY secret is not provided; will use debug signing fallback")
        shell: python

      - name: Download libv2ray.aar
        run: |
          mkdir -p app/libs
          if [ ! -f "app/libs/libv2ray.aar" ]; then
            curl -L "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar" -o app/libs/libv2ray.aar
          fi

      - name: Build with Gradle
        env:
          RELEASE_STORE_FILE: "release-key.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -f "app/release-key.jks" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
            mkdir -p app/build/outputs/apk/release
            cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/hamedvpns.apk
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
