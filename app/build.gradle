plugins {
    id 'com.android.application'
}

def downloadLibv2rayIfNeeded() {
    def dest = file("libs/libv2ray.aar")
    if (dest.exists() && dest.length() > 1000000) {
        return
    }
    println "libv2ray.aar missing or incomplete, downloading..."
    dest.parentFile.mkdirs()
    String currentUrl = "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.7.5/libv2ray.aar"
    int redirects = 0
    while (currentUrl != null && redirects < 10) {
        URL url = new URI(currentUrl).toURL()
        HttpURLConnection conn = (HttpURLConnection) url.openConnection()
        conn.instanceFollowRedirects = true
        conn.setRequestProperty("User-Agent", "Mozilla/5.0")
        int status = conn.responseCode
        if (status >= 300 && status < 400) {
            currentUrl = conn.getHeaderField("Location")
            conn.disconnect()
            redirects++
            continue
        }
        if (status == 200) {
            dest.withOutputStream { out ->
                conn.inputStream.withCloseable { inp ->
                    out << inp
                }
            }
            conn.disconnect()
            println "Successfully downloaded libv2ray.aar (${dest.length()} bytes)"
            return
        }
        conn.disconnect()
        throw new GradleException("Failed to download libv2ray.aar, status: " + status)
    }
}
downloadLibv2rayIfNeeded()

android {
    namespace 'com.hamedvpn.vpngit'
    compileSdk 34

    defaultConfig {
        applicationId "com.hamedvpn.vpngit"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debugConfig {
            storeFile file("${rootDir}/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            storeFile file(System.getenv("RELEASE_STORE_FILE") ?: (project.hasProperty('RELEASE_STORE_FILE') ? RELEASE_STORE_FILE : "release-key.jks"))
            storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: (project.hasProperty('RELEASE_STORE_PASSWORD') ? RELEASE_STORE_PASSWORD : "")
            keyAlias System.getenv("RELEASE_KEY_ALIAS") ?: (project.hasProperty('RELEASE_KEY_ALIAS') ? RELEASE_KEY_ALIAS : "")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD") ?: (project.hasProperty('RELEASE_KEY_PASSWORD') ? RELEASE_KEY_PASSWORD : "")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debugConfig
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    splits {
        abi {
            enable false
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['java']
            kotlin.srcDirs = ['java']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
        test {
            java.srcDirs = ['src/test/java']
            kotlin.srcDirs = ['src/test/java']
        }
    }
}

repositories {
    google()
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

